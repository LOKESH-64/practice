<!--
Box model: In css we are going to wrap content using margin, border, paddy with semantic elements
A Box model is going to work like a container
1. margin: gap between 2 elements
1.1 margin-top
1.2 margin-bottom
1.3 margin-right
1.4 margin-left
1.5 margin(shorthand)
1.6 margin: 4% (for all sides)
1.7 margin: 5% 8%(top bottom and left right)
1.8 margin: 7% 2% 12% 9% (clockwise direction top right bottom left)

Padding:gap present inside an  element
2.1 padding-top
2.2 padding-bottom
2.3 padding-right
2.4 padding-left
2.5 padding(shorthand)
2.6 padding: 4% (for all sides)
2.7 padding: 5% 8%(top bottom and left right)
2.8 padding: 7% 2% 12% 9% (clockwise direction top right bottom left)

Border: which will present between margin and padding
Properties:
1. border(shorthand)
2. border-width
3.border-style
4.border-color
5.border-radius
-->
