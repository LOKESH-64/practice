<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Screening System</title>

    <style>

        body{
            background-color:wheat;
            font-family:Arial, Helvetica, sans-serif;
        }

        .main{
            width:500px;
            margin:auto;
            margin-top:80px;
            background-color:white;
            padding:40px;
            border-radius:15px;
            box-shadow:0px 0px 10px gray;
        }

        h1{
            text-align:center;
            color:darkgreen;
            margin-bottom:30px;
        }

        h3{
            color:darkblue;
        }

        input[type="file"]{
            width:100%;
            padding:10px;
            margin-top:10px;
        }

        textarea{
            width:100%;
            height:120px;
            padding:10px;
            margin-top:10px;
            font-size:16px;
        }

        input[type="submit"]{
            width:100%;
            padding:12px;
            margin-top:25px;
            font-size:18px;
            background-color:darkgreen;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
        }

        input[type="submit"]:hover{
            background-color:green;
        }

        .info{
            margin-top:15px;
            font-size:15px;
            color:gray;
        }

    </style>

</head>

<body>

    <div class="main">

        <h1>Resume Screening System</h1>

        <!-- Resume Upload Form -->
        <form action="/analyze" method="post" enctype="multipart/form-data">

            <h3>Upload Your Resume</h3>

            <input type="file" name="resume" required>

            <h3>Enter Required Skills (Comma Separated)</h3>

            <textarea 
                name="skills" 
                placeholder="Example: Python, Flask, MySQL, HTML, CSS"
                required>
            </textarea>

            <p class="info">
                Supported formats : .pdf and .txt
            </p>

            <input type="submit" value="Analyze Resume">

        </form>

    </div>

</body>
</html>
